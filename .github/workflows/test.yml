name: Run Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.3

      - name: Run Unit Tests
        run: deno test --allow-read --allow-write tests/unit.test.js

      - name: Verify Code Format
        run: deno fmt --check

      - name: Run Linter
        run: deno lint
